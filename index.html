<style>
:root{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a1020;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{position:fixed;left:0;top:0}#h{pointer-events:none}
#act{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));top:38%;width:92px;height:92px;border-radius:50%;border:3px solid #ffc83c;background:#000a;color:#ffc83c;font:700 13px system-ui;display:none;touch-action:none}
#rel{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));top:54%;width:62px;height:62px;border-radius:50%;border:3px solid #fff9;background:#000a;color:#fff;font:700 15px system-ui;touch-action:none}#rel:active{background:#fff;color:#000}
#gre{position:fixed;right:calc(30px + env(safe-area-inset-right,0px));top:calc(54% + 74px);width:52px;height:52px;border-radius:50%;border:3px solid #9fc25a;background:#000a radial-gradient(circle at 50% 56%,#56652c 0 11px,transparent 12px);touch-action:none}
#gre::after{content:'';position:absolute;left:21px;top:9px;width:8px;height:7px;background:#9a9a92;border-radius:2px}
#gre.vide{opacity:.3}
#act:active{background:#ffc83c;color:#000}

#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(5,9,18,.78),rgba(5,9,18,.92));font-family:system-ui,sans-serif;color:#fff}
#menu .panel{width:min(92vw,460px);padding:28px;border:1px solid #ffffff25;border-radius:18px;background:#101827ee;box-shadow:0 20px 80px #0008;text-align:center}
#menu h1{margin:0 0 6px;font-size:40px;letter-spacing:6px}#menu .sub{opacity:.65;margin-bottom:24px}
.menuBtn{display:block;width:100%;padding:15px;margin:10px 0;border:1px solid #ffffff22;border-radius:11px;background:#1a2639;color:#fff;font:700 16px system-ui;cursor:pointer}.menuBtn:hover{background:#24344d}
.menuInput{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;border:1px solid #ffffff25;background:#0a1020;color:#fff;font:700 18px system-ui;text-align:center;text-transform:uppercase;margin:7px 0}
#roomCode{font-size:32px;letter-spacing:7px;font-weight:900;margin:12px 0 20px}#players{margin:18px 0;text-align:left}.player{padding:9px 12px;margin:5px 0;border-radius:8px;background:#ffffff08}.blue{border-left:4px solid #4d8dff}.bo{border-left:4px solid #d8dde3;background:#1d1f2299!important}.sp{border-left:4px solid #27e8ff;background:#0a2a3299!important}.vo{border-left:4px solid #ff2fd0;background:#2a0a2499!important}.vp{border-left:4px solid #9fc25a;background:#5a6b2e44!important}.red{border-left:4px solid #ff4d5c}.bz{border-left:4px solid #2f9be0;background:#12304699!important}.kd{border-left:4px solid #9a6a32;background:#3a2a1699!important}.small{font-size:12px;opacity:.6}.danger{color:#ff7c7c}.ok{color:#76e59a}
#mapPick{margin:4px 0 14px}.srvRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.srvBtn{padding:9px 6px;border:1px solid #ffffff22;border-radius:10px;background:#141d2c;color:#cfd6e2;font:700 13px system-ui;cursor:pointer}.srvBtn.sel{background:#2a3a55;border-color:#9fb6f0;color:#fff}.srvBtn small{display:block;font-weight:600;opacity:.6;font-size:11px;margin-top:2px}.mapRow{display:flex;gap:8px}.mapBtn{flex:1;padding:11px 6px;border:1px solid #ffffff22;border-radius:10px;background:#141d2c;color:#cfd6e2;font:700 14px system-ui;cursor:pointer}.mapBtn.sel{background:#2a3a55;border-color:#9fb6f0;color:#fff}
#menuMsg{min-height:20px;margin:8px 0;font-size:13px;color:#ffc83c}.hidden{display:none!important}
#fsBtn{position:fixed;right:calc(52px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:34px;height:34px;border-radius:10px;border:1px solid #ffffff2a;background:#000a;color:#fff;opacity:.5;display:none;align-items:center;justify-content:center;z-index:55;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}#fsBtn:active{opacity:.9}#fsBtn svg{width:18px;height:18px}
#fsTip{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:86vw;background:#0b1220ee;color:#fff;font:500 13px system-ui;padding:10px 14px;border-radius:10px;z-index:56;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}

/* menu et salon : toujours entierement accessibles (defilement si l'ecran est trop petit), plus compacts */
#menu{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(10px,env(safe-area-inset-top)) 0 max(10px,env(safe-area-inset-bottom))}
#menu .panel{margin:auto;max-height:none;padding:clamp(14px,3.2vh,28px)}
#players{margin:10px 0}
.player{padding:6px 12px;margin:3px 0}
@media (max-height:760px){#menu h1{font-size:32px}#menu .sub{margin-bottom:12px}#menu button{padding-top:11px!important;padding-bottom:11px!important;margin-top:7px!important}.player{padding:4px 10px;margin:2px 0;font-size:14px}#roomCode{font-size:30px!important}}
@media (max-height:560px){.player{padding:3px 8px;font-size:13px}#players{margin:6px 0}#menu button{padding-top:8px!important;padding-bottom:8px!important}}

/* bouton quitter (en haut a droite) et sa confirmation */
#muteBtn{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:34px;height:34px;border-radius:10px;border:1px solid #ffffff2a;background:#08101cb8;color:#ffffffcc;display:flex;align-items:center;justify-content:center;z-index:56;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}#muteBtn.off{color:#ff7a7a;border-color:#ff7a7a66}#sbBtn{position:fixed;right:calc(94px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:34px;height:34px;border-radius:10px;border:1px solid #ffffff2a;background:#08101cb8;color:#ffffffcc;display:none;align-items:center;justify-content:center;z-index:56;padding:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}#sbBtn .sl{display:none}#sbBtn.off{color:#ffd27a;border-color:#ffd27a66}#sbBtn.off .sl{display:inline}body.sbopen #sbBtn{visibility:hidden!important}body.inmenu #sbBtn{display:none!important}#quitBtn{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:34px;height:34px;border-radius:10px;border:1px solid #ffffff2a;background:#08101cb8;color:#ffffffcc;display:none;align-items:center;justify-content:center;z-index:56;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s}
#quitBtn:hover,#quitBtn:active{background:#a8302a;color:#fff;border-color:#ff8a7a66}
#quitBox{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:#05091299;font-family:system-ui,sans-serif}
#quitBox .qpanel{width:min(86vw,320px);padding:20px 18px 16px;border-radius:16px;border:1px solid #ffffff25;background:#101827f2;color:#fff;text-align:center;box-shadow:0 18px 60px #000a}
#quitBox .qt{font-weight:800;font-size:17px;margin-bottom:6px}#quitBox .qs{font-size:13px;opacity:.65;margin-bottom:16px}
#quitBox .qb{display:flex;gap:10px}#quitBox .qb button{flex:1;padding:11px 0;border-radius:10px;border:1px solid #ffffff25;background:#1b2740;color:#fff;font:700 14px system-ui;cursor:pointer}
#quitBox #quitYes{background:#a8302a;border-color:#ff8a7a55}
/* mobile : recharger et grenade rapproches du centre, cote a cote (grenade la plus proche du centre) */
@media (pointer:coarse){
 #rel{right:calc(16px + 2vw + env(safe-area-inset-right,0px));top:auto;bottom:calc(30% + env(safe-area-inset-bottom,0px))}
 #gre{right:calc(16px + 2vw + 74px + env(safe-area-inset-right,0px));top:auto;bottom:calc(30% + 5px + env(safe-area-inset-bottom,0px))}
}

/* choix de la langue (masque dans le salon : changer de langue recharge la page) */
#menu:has(#lobby:not(.hidden)) #langSel{display:none}
#langSel{display:flex;gap:8px;justify-content:center;margin:2px 0 14px}
#langSel button{padding:6px 12px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff10;color:#ffffffcc;font:700 12px system-ui;cursor:pointer}
#langSel button.on{background:#ffffff2e;color:#fff;border-color:#ffffff66}

 #rel{right:calc(27px + env(safe-area-inset-right,0px));top:auto;bottom:calc(30% + env(safe-area-inset-bottom,0px));width:58px;height:58px}

 #hornBtn{right:calc(112px + env(safe-area-inset-right,0px));top:auto;margin-top:0;bottom:calc(30% + 89px + env(safe-area-inset-bottom,0px))}
 #canBtn{right:calc(114px + env(safe-area-inset-right,0px));bottom:calc(30% + 91px + env(safe-area-inset-bottom,0px))}   /* a pied : a gauche de l'action */
 body.drv #canBtn{right:calc(176px + env(safe-area-inset-right,0px))}   /* au volant : a gauche du klaxon */
 body.drv #rel,body.drv #gre{display:none!important}
}

#menu h1 .ver{position:absolute;margin:13px 0 0 8px;padding:3px 7px 2px;line-height:1.2;border-radius:6px;border:1px solid #ffc83c66;background:#ffc83c1a;color:#ffc83c;font:800 12px system-ui;letter-spacing:1px}

#founder .xl svg{width:13px;height:13px}
#menu:has(#lobby:not(.hidden)) #founder{display:none}
@media (max-height:760px){#founder{margin-top:10px;padding:7px 10px}#founder .av{width:38px;height:38px}#menu h1 .ver{margin-top:9px}}

// voile du desert : dunes douces, lit de riviere asseche, bords plus sombres pres des falaises
function desertOverlay(){const c=document.createElement('canvas');c.width=1600;c.height=Math.round(1600*WH/WW);const x=c.getContext('2d'),k=c.width/WW;
 // grandes ondulations de dunes : bandes claires (versant au soleil) et sombres (versant a l'ombre)
 for(let i=0;i<46;i++){const X=rnd()*c.width,Y=rnd()*c.height,r=60+rnd()*200;x.save();x.translate(X,Y);x.rotate(-.5+rnd()*.3);x.scale(1.9,.6);
  const q=x.createRadialGradient(0,0,0,0,0,r);q.addColorStop(0,i%2?'rgba(255,238,200,.12)':'rgba(110,76,40,.20)');q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.fillRect(-r,-r,2*r,2*r);x.restore()}
 // rides de vent : courbes paralleles fines, orientees comme le vent
 for(let i=0;i<1400;i++){const X=rnd()*c.width,Y=rnd()*c.height,L=18+rnd()*46,a=-.42+rnd()*.12,ph=rnd()*6;
  x.strokeStyle='rgba(250,228,186,.32)';x.lineWidth=1.1;x.beginPath();
  for(let t=0;t<=L;t+=3){const px=X+Math.cos(a)*t-Math.sin(a)*Math.sin(t/7+ph)*1.6,py=Y+Math.sin(a)*t+Math.cos(a)*Math.sin(t/7+ph)*1.6;t?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
  x.strokeStyle='rgba(120,86,48,.24)';x.beginPath();for(let t=0;t<=L;t+=3){const px=X+Math.cos(a)*t-Math.sin(a)*(Math.sin(t/7+ph)*1.6+1.6),py=Y+Math.sin(a)*t+Math.cos(a)*(Math.sin(t/7+ph)*1.6+1.6);t?x.lineTo(px,py):x.moveTo(px,py)}x.stroke()}
 // lit de riviere asseche
 const wadi=[[200,1820],[800,1700],[1400,1560],[2000,1480],[2600,1520],[3150,1380],[3700,1310],[4300,1240]];
 x.lineCap='round';x.lineJoin='round';x.filter='blur(14px)';for(const[w,al]of[[300,.10],[190,.12],[100,.10]]){x.strokeStyle='rgba(126,92,54,'+al+')';x.lineWidth=w*k;x.beginPath();wadi.forEach(([px,py],i)=>i?x.lineTo(px*k,py*k):x.moveTo(px*k,py*k));x.stroke()}
 x.filter='none';
 if(CUR.POLY){x.save();x.beginPath();CUR.POLY.forEach(([px,py],i)=>i?x.lineTo(px*k,py*k):x.moveTo(px*k,py*k));x.closePath();x.lineWidth=90*k;x.strokeStyle='rgba(70,52,36,.24)';x.filter='blur(10px)';x.stroke();x.restore()}
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}

 // silhouette pleine de la palme (pour qu'elle reste bien visible de loin)
 const sil=(sg)=>{x.beginPath();x.moveTo(0,H/2);for(let i=0;i<=40;i++){const f=i/40,u=f*(W-4),len=(H*.47)*Math.sin(Math.min(1,f*1.2)*Math.PI*.95)*(1-f*.3);x.lineTo(u+len*.35,H/2+sg*len*.82)}x.lineTo(W-4,H/2);x.closePath()};

   x.beginPath();x.moveTo(u,H/2);x.quadraticCurveTo(u+len*.22,H/2+sg*len*.5,u+len*.5,H/2+sg*len);x.stroke();
   x.strokeStyle='rgba(255,255,220,.18)';x.lineWidth=1.6;x.beginPath();x.moveTo(u+1,H/2);x.quadraticCurveTo(u+len*.22,H/2+sg*len*.48,u+len*.48,H/2+sg*len*.96);x.stroke()}}
 x.strokeStyle=dry?'#7a5e34':'#5e6e34';x.lineWidth=4;x.beginPath();x.moveTo(0,H/2);x.lineTo(W-6,H/2);x.stroke()});
