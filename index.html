:root{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a1020;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{position:fixed;left:0;top:0}#h{pointer-events:none}
#act{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));top:38%;width:92px;height:92px;border-radius:50%;border:3px solid #ffc83c;background:#000a;color:#ffc83c;font:700 13px system-ui;display:none;touch-action:none}
#rel{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));top:54%;width:62px;height:62px;border-radius:50%;border:3px solid #fff9;background:#000a;color:#fff;font:700 15px system-ui;touch-action:none}#rel:active{background:#fff;color:#000}
#gre{position:fixed;right:calc(30px + env(safe-area-inset-right,0px));top:calc(54% + 74px);width:52px;height:52px;border-radius:50%;border:3px solid #9fc25a;background:#000a radial-gradient(circle at 50% 56%,#56652c 0 11px,transparent 12px);touch-action:none}

 #rel{right:calc(16px + 2vw + env(safe-area-inset-right,0px));top:auto;bottom:calc(30% + env(safe-area-inset-bottom,0px))}
